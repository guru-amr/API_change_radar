spring:
  application:
    name: api-change-radar
  datasource:
    url: jdbc:postgresql://localhost:5432/apichangeradar
    username: postgres
    password: kutty#33#
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
jwt:
  secret: "${JWT_SECRET:change-me-in-local-dev-only-please-use-strong-secret-in-prod-min-32-chars}"
  expiration-ms: 86400000
app:
  scheduler:
    enabled: true
    poll-interval-ms: 30000
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
    thread-name-prefix: alert-async-
resilience4j:
  retry:
    instances:
      specFetchRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
  circuitbreaker:
    instances:
      specFetchCb:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  level:
    com.apichangeradar: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

